<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskFlow Pro</title>

<link rel="stylesheet" href="styles.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div>
            <h1>TaskFlow Pro</h1>
            <p>Modern productivity task manager</p>
        </div>

        <button id="themeToggle" class="theme-btn">🌙</button>
    </header>

    <!-- STATS DASHBOARD -->
    <section class="stats-grid">

        <div class="stat-card">
            <span>Total Tasks</span>
            <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat-card">
            <span>Completed</span>
            <h2 id="completedTasks">0</h2>
        </div>

        <div class="stat-card">
            <span>Pending</span>
            <h2 id="pendingTasks">0</h2>
        </div>

        <div class="stat-card">
            <span>High Priority</span>
            <h2 id="highTasks">0</h2>
        </div>

    </section>

    <!-- PROGRESS -->
    <section class="progress-card">

        <div class="progress-header">
            <span>Progress</span>
            <span id="progressPercent">0%</span>
        </div>

        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>

    </section>

    <!-- ADD TASK -->
    <section class="add-task-card">

        <input
            type="text"
            id="taskInput"
            placeholder="e.g. Finish portfolio homepage design"
        >

        <input
            type="text"
            id="categoryInput"
            placeholder="e.g. Work, Personal, Fitness"
        >

        <input
            type="date"
            id="dueDateInput"
        >

        <select id="priorityInput">
            <option value="low">🟢 Low Priority</option>
            <option value="medium" selected>🟡 Medium Priority</option>
            <option value="high">🔴 High Priority</option>
        </select>

        <button id="addBtn">Add Task</button>

    </section>

    <!-- SEARCH -->
    <section class="search-section">
        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search tasks, categories, or priority..."
        >
    </section>

    <!-- CATEGORY FILTERS -->
    <section id="categoryFilters" class="categories">
        <button class="chip active" data-category="all">All</button>
    </section>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="empty-state">
        <h3>📋 No tasks yet</h3>
        <p>
            Try adding:<br><br>
            💼 Finish project proposal<br>
            🏋️ Gym workout at 6 PM<br>
            📚 Study JavaScript<br>
            🛒 Buy groceries
        </p>
    </div>

    <!-- TASK LIST -->
    <section id="taskList" class="task-list"></section>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal">

    <div class="modal-content">

        <h2>Edit Task</h2>

        <input type="text" id="editTaskText" placeholder="Task name">
        <input type="text" id="editCategory" placeholder="Category">
        <input type="date" id="editDate">

        <select id="editPriority">
            <option value="low">🟢 Low</option>
            <option value="medium">🟡 Medium</option>
            <option value="high">🔴 High</option>
        </select>

        <div class="modal-actions">
            <button id="saveEdit">Save</button>
            <button id="cancelEdit">Cancel</button>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
